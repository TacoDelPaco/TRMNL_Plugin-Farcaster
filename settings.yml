name: Farcaster Notifications
description: Display Farcaster user notifications and activity breakdown on your TRMNL e-ink screen.
strategy: polling
polling_url: "https://api.neynar.com/v2/farcaster/notifications?fid={{ farcaster_fid }}&limit=10"
polling_headers: |
  {
    "accept": "application/json",
    "x-api-key": "{{ neynar_api_key }}"
  }

custom_fields:
  - keyname: farcaster_fid
    name: Farcaster FID
    field_type: number
    description: "Your numerical Farcaster ID (FID)."
    required: true

  - keyname: neynar_api_key
    name: Neynar API Key
    field_type: password
    description: "Your Neynar API key from dev.neynar.com."
    required: true
