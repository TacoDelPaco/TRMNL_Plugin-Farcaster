  field_type: number
  description: Your numerical Farcaster ID (FID).
- keyname: neynar_api_key
  name: Neynar API Key
  field_type: password
  description: Your Neynar API key from dev.neynar.com.
name: 'Farcaster Notifs '
description: "Notifs through Neynar \U0001F49C"
